
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f2f2f2;
        }

        .caixa {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #222;
            color: white;
        }

        #mensagem {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="caixa">
    <h1>Redefinir senha</h1>

    <p>Digite sua nova senha:</p>

    <input type="password" id="senha" placeholder="Nova senha">

    <input type="password" id="confirmar" placeholder="Confirmar nova senha">

    <button onclick="alterarSenha()">Alterar senha</button>

    <div id="mensagem"></div>
</div>

<script>
    const SUPABASE_URL = "https://ahsrukaodswcdigwynhm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_HY16cUliwRQLziip5SuCjw_kHXJILp_";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    async function alterarSenha() {
        const senha = document.getElementById("senha").value;
        const confirmar = document.getElementById("confirmar").value;
        const mensagem = document.getElementById("mensagem");

        if (senha.length < 6) {
            mensagem.textContent = "A senha deve ter pelo menos 6 caracteres.";
            return;
        }

        if (senha !== confirmar) {
            mensagem.textContent = "As senhas não são iguais.";
            return;
        }

        const { error } = await supabaseClient.auth.updateUser({
            password: senha
        });

        if (error) {
            mensagem.textContent = "Erro ao alterar a senha: " + error.message;
            return;
        }

        mensagem.textContent = "Senha alterada com sucesso!";

        document.getElementById("senha").value = "";
        document.getElementById("confirmar").value = "";
    }
</script>

</body>
</html>
